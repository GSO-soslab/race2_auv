control_modes:
  idle: false

  teleop:
    z:        {p: 20.0,    i: 0.5 ,  d: 5.0,  pid_max: 30, pid_min: -30}
    u:        {p: 50.0,    i: 10.0,   d: 0.0,   pid_max: 30, pid_min: -30}
    pitch:    {p: 30.0,   i: 0.5,  d: 1.0,  pid_max: 20, pid_min: -20}
    yaw:      {p: 10.0,   i: 0.2,   d: 5.0,  pid_max: 20, pid_min: -20}

  flight:
    # z:        {p: 20.0,    i: 2.0 ,  d: 5.0,  i_max: 30, i_min: -30}
    u:    {p: 50.0,    i: 10.0,   d: 0.0,   pid_max: 30, pid_min: -30}
    # pitch:    {p: 10.0,    i: 0.0,   d: 10.0,  i_max: 20, i_min: -20}
    # yaw:      {p: 10.0,    i: 1.0,   d: 10.0,  i_max: 30, i_min: -30}

  4dof:
    z:        {p: 20.0,   i: 1.0,  d:  15.0,  pid_max: 40.0, pid_min: -40.0}
    u:        {p: 12.0,    i: 18.0,   d: 0.5,   pid_max: 50.0, pid_min: -50.0}
    v:        {p: 3.0,    i: 0.2,   d: 0.2,   pid_max: 15.0, pid_min: -15.0}
    roll:     {p: 3.0,   i: 0.5,  d: 0.5,  pid_max: 15.0, pid_min: -15.0}
    pitch:    {p: 5.0,   i: 0.5,  d: 1.0,  pid_max: 15.0, pid_min: -15.0}
    yaw:      {p: 25.0,   i: 1.5,   d: 25.0,  pid_max: 35.0, pid_min: -35.0}

    
