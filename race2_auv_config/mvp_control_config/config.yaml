    polynomials: [0.0, 24.9953, 6.2616, 36.1127, 2.31299]


vector_thruster_ids:
  surge_port:
    control_tf: surge_port_thruster_link
    command_topic: control/thruster/surge_port
    force_topic: control/force/surge_port
    limits: [-25.0, 25.0] #[min, max]
    # polynomials: [0.0305, 18.9527, 6.1205, 64.0375, 2.4386, -24.8871]
    polynomials: [0.0, 24.9953, 6.2616, 36.1127, 2.31299]
    servo_topic: control/surge_port_servo
    servo_joint: surge_port_servo_joint
    servo_speed: 1.0
    angle_limits: [-2.356, 2.356]

  surge_starboard:
    control_tf: surge_starboard_thruster_link
    command_topic: control/thruster/surge_starboard
    force_topic: control/force/surge_starboard
    limits: [-25.0, 25.0] #[min, max]
    # polynomials: [0.0305, 18.9527, 6.1205, 64.0375, 2.4386, -24.8871]
    polynomials: [0.0, 24.9953, 6.2616, 36.1127, 2.31299]
    servo_topic: control/surge_starboard_servo   #angle command
    servo_joint: surge_starboard_servo_joint
    servo_speed: 1.0
    angle_limits: [-2.356, 2.356]

