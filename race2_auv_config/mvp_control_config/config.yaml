control_modes:
  idle: false

  teleop:
    z:        {p: 20.0,    i: 2.0 ,  d: 5.0,  pid_max: 30, pid_min: -30}
    u:        {p: 50.0,    i: 10.0,   d: 0.0,   pid_max: 30, pid_min: -30}
    pitch:    {p: 30.0,   i: 0.5,  d: 1.0,  pid_max: 20, pid_min: -20}
    yaw:      {p: 10.0,   i: 0.2,   d: 5.0,  pid_max: 20, pid_min: -20}

  flight:
    # z:        {p: 20.0,    i: 2.0 ,  d: 5.0,  i_max: 30, i_min: -30}
    u:    {p: 50.0,    i: 10.0,   d: 0.0,   pid_max: 30, pid_min: -30}
    # pitch:    {p: 10.0,    i: 0.0,   d: 10.0,  i_max: 20, i_min: -20}
    # yaw:      {p: 10.0,    i: 1.0,   d: 10.0,  i_max: 30, i_min: -30}

  4dof:
    z:        {p: 10.0,   i: 1.0 ,  d: 5.0,  pid_max: 30, pid_min: -30}
    u:        {p: 100.0,    i: 5.0,   d: 0.0,   pid_max: 40, pid_min: -40}
    v:        {p: 5.0,    i: 1.0,   d: 0.2,   pid_max: 20, pid_min: -20}
    pitch:    {p: 10.0,   i: 1.0,  d: 1.0,  pid_max: 20, pid_min: -20}
    yaw:      {p: 15.0,   i: 2.0,   d: 5.0,  pid_max: 20, pid_min: -20}

thruster_ids:

  sway_bow:
    control_tf: sway_thruster_link
    command_topic: control/thruster/sway
    force_topic: control/force/sway
    limits: [-25.0, 25.0] #[min, max]
    polynomials: [0.0305, 18.9527, 6.1205, 64.0375, 2.4386, -24.8871]

  heave_bow:
    control_tf: heave_bow_thruster_link
    command_topic: control/thruster/heave_bow
    force_topic: control/force/heave_bow
    limits: [-20.0, 20.0] #[min, max]
    polynomials: [0.0305, 18.9527, 6.1205, 64.0375, 2.4386, -24.8871]

vector_thruster_ids:
  surge_port:
    control_tf: surge_port_thruster_link
    command_topic: control/thruster/surge_port
    force_topic: control/force/surge_port
    limits: [-25.0, 25.0] #[min, max]
    polynomials: [0.0305, 18.9527, 6.1205, 64.0375, 2.4386, -24.8871]
    servo_topic: control/surge_port_servo
    servo_joint: surge_port_servo_joint
    servo_speed: 2.0
    angle_limits: [-3.0, 3.0]

  surge_starboard:
    control_tf: surge_starboard_thruster_link
    command_topic: control/thruster/surge_starboard
    force_topic: control/force/surge_starboard
    limits: [-25.0, 25.0] #[min, max]
    polynomials: [0.0305, 18.9527, 6.1205, 64.0375, 2.4386, -24.8871]
    servo_topic: control/surge_starboard_servo
    servo_joint: surge_starboard_servo_joint
    servo_speed: 2.0
    angle_limits: [-3.0, 3.0]

